name: Native Mail Rootfs Export
on:
  push:
    branches: [elastic/native-runtime-2026-09-27]
    paths: [native/**, data/web/inc/functions.docker.inc.php, data/Dockerfiles/acme/reload-configurations.sh, data/Dockerfiles/dovecot/sa-rules.sh, data/Dockerfiles/phpfpm/docker-entrypoint.sh, data/Dockerfiles/watchdog/watchdog.sh, .github/workflows/native-rootfs-export.yml]
  workflow_dispatch:
    inputs:
      service:
        description: Pinned service name, or all for 18-service export
        required: true
        default: unbound-mailcow
        type: string
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-26.04
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          REQUESTED_SERVICE: ${{ inputs.service || 'dovecot-mailcow' }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          names=[row['service'] for row in json.loads(pathlib.Path('native/pinned-images.json').read_text())]
          chosen=os.environ['REQUESTED_SERVICE']
          if chosen!='all' and chosen not in names:raise SystemExit('Unknown pinned service')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('services='+json.dumps(names if chosen=='all' else [chosen])+'\n')
          PY
  export:
    needs: select
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Test closed policies, Unix framing, spool lifetime and actual renameat2
        run: |
          sudo python3 -m unittest discover -s native/tests -p 'test*.py'
          bash -n data/Dockerfiles/acme/reload-configurations.sh
          bash -n data/Dockerfiles/dovecot/sa-rules.sh
          bash -n data/Dockerfiles/phpfpm/docker-entrypoint.sh
          bash -n data/Dockerfiles/watchdog/watchdog.sh
      - name: Install off-host exporter tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo umoci
          skopeo --version
          umoci --version
      - name: Export pinned upstream root tree and isolated version probe
        env:
          SERVICE: ${{ matrix.service }}
        run: sudo python3 native/export_rootfs.py --service "$SERVICE" --output "$RUNNER_TEMP/mailcow-native-artifacts"
      - name: Rehearse real DNS, systemd isolation and control peer denials
        if: matrix.service == 'unbound-mailcow'
        run: |
          systemctl --version
          sudo python3 native/rehearse_unbound.py --artifacts "$RUNNER_TEMP/mailcow-native-artifacts" --output "$RUNNER_TEMP/mailcow-native-artifacts/unbound-rehearsal.json"
      - name: Rehearse Dovecot privilege profile, IMAP and flatcurve state
        if: matrix.service == 'dovecot-mailcow'
        run: sudo python3 native/rehearse_dovecot.py --artifacts "$RUNNER_TEMP/mailcow-native-artifacts" --output "$RUNNER_TEMP/mailcow-native-artifacts/dovecot-rehearsal.json"
      - name: Rehearse actual admin commands, caller identity, large results and slow lease
        if: matrix.service == 'dovecot-mailcow'
        run: sudo python3 native/tests/rehearse_control_runtime.py --artifacts "$RUNNER_TEMP/mailcow-native-artifacts" --output "$RUNNER_TEMP/mailcow-native-artifacts/control-runtime-rehearsal.json"
      - name: Rehearse Postfix durable SMTP queue and local-sink recovery
        if: matrix.service == 'postfix-mailcow'
        run: sudo python3 native/rehearse_postfix.py --artifacts "$RUNNER_TEMP/mailcow-native-artifacts" --output "$RUNNER_TEMP/mailcow-native-artifacts/postfix-rehearsal.json"
      - uses: actions/upload-artifact@v4
        with:
          name: native-rootfs-${{ matrix.service }}
          path: ${{ runner.temp }}/mailcow-native-artifacts
          compression-level: 0
          retention-days: 30

  canonical-store-rehearsal:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse canonical move, writer locks and same-store rollback
        run: sudo python3 native/tests/rehearse_store_ownership.py > "$RUNNER_TEMP/canonical-store-rehearsal.json"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-store-rehearsal
          path: ${{ runner.temp }}/canonical-store-rehearsal.json
          retention-days: 30
